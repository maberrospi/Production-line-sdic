# Level 5: a primary that archives its WAL, a streaming replica cloned from it, and (profile "pitr")
# a server restored to a point in time from a base backup plus the archive.
# All three use the official postgres:16 image with a small entrypoint script in front of it.
# No ports are published: ./pg.sh <service> runs psql inside a container.
x-pg: &pg
  image: postgres:16
  environment:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: lab
    RESTORE_TARGET: ${RESTORE_TARGET:-}
  volumes:
    - ./scripts:/scripts:ro
    - wal-archive:/wal-archive
    - backups:/backups
  stop_grace_period: 20s

services:
  primary:
    <<: *pg
    entrypoint: ["/scripts/primary-entrypoint.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ./sql:/docker-entrypoint-initdb.d:ro
      - wal-archive:/wal-archive
      - backups:/backups
      - primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab"]
      interval: 2s
      retries: 30

  replica:
    <<: *pg
    entrypoint: ["/scripts/replica-entrypoint.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - replica-data:/var/lib/postgresql/data
    depends_on:
      primary: { condition: service_healthy }

  restore:
    <<: *pg
    profiles: ["pitr"]
    entrypoint: ["/scripts/restore-entrypoint.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - wal-archive:/wal-archive:ro
      - backups:/backups:ro
      - restore-data:/var/lib/postgresql/data

volumes:
  primary-data: {}
  replica-data: {}
  restore-data: {}
  wal-archive: {}
  backups: {}

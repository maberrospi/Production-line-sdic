# The API gateway: one place for authentication, rate limits, timeouts, routing and request IDs.
events {}
http {
    default_type application/json;

    # Authentication: the API key decides who the client is ("" = nobody).
    map $http_x_api_key $client { "key-alice" alice; "key-bob" bob; default ""; }
    map $uri $needs_key { /health 0; default 1; }
    map "$needs_key:$client" $unauthorized { "1:" 1; default 0; }

    # Rate limit per client (not per IP): 10 requests/second on average, bursts of 20 (below).
    limit_req_zone $client zone=perclient:10m rate=10r/s;
    limit_req_status 429;

    # One JSON line per request, carrying the request ID the services also see.
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","client":"$client",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,'
                                '"upstream":"$upstream_addr","upstream_s":"$upstream_response_time","total_s":$request_time}';
    access_log /dev/stdout json;

    upstream users  { server users:8000;  keepalive 8; }
    upstream orders { server orders:8000; keepalive 8; }

    server {
        listen 80;
        add_header X-Request-ID $request_id always;

        # Runs before any location is chosen, so no route can forget it.
        if ($unauthorized) { return 401 '{"error":"missing or unknown X-Api-Key"}\n'; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client $client;
        proxy_connect_timeout 1s;

        location = /health { return 200 '{"ok":true}\n'; }

        location /users/ {
            limit_req zone=perclient burst=20 nodelay;
            proxy_read_timeout 2s;          # give up on a slow service after 2 s (step 2)
            proxy_pass http://users;
        }

        location ~ ^/(v1|v2)/orders {
            limit_req zone=perclient burst=20 nodelay;
            proxy_read_timeout 5s;
            proxy_pass http://orders;
        }

        location / { return 404 '{"error":"no route"}\n'; }
    }
}

[databases]
lab = host=db port=5432 dbname=lab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = lab

; Transaction pooling: a server connection is lent to a client for one transaction at a time.
pool_mode = transaction
; Server connections per database/user pair. Postgres sees at most this many from PgBouncer.
default_pool_size = 20
; Client connections PgBouncer will accept (the default, 100, is too low for step 8).
max_client_conn = 1000
; Prepared statements work in transaction mode since PgBouncer 1.21 when this is non-zero.
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits

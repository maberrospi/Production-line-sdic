# Level 4: Postgres 16 with pg_stat_statements, PgBouncer, and a tools container for the scripts.
# No ports are published: you reach Postgres with "docker compose exec", as you would on a server.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]
    volumes:
      - ./sql:/sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Connection pooler: many client connections share 20 server connections (step 8).
  pgbouncer:
    build: ./pgbouncer
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Python scripts for steps 5-8. Started on demand with "docker compose run --rm tools python <script>".
  tools:
    build: ./tools
    profiles: ["tools"]
    working_dir: /scripts
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata: {}

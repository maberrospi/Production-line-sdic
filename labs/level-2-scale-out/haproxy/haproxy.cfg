# HAProxy configuration for the Level 2 lab.
# Values in double quotes like "${BALANCE}" are read from the environment (set in compose.yaml).

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client  30s
    timeout server  10s          # a hung server is given up on after 10 s (step 5, "try a hang")
    retries 2                    # retry a failed connection attempt up to twice...
    option redispatch            # ...and allow the last retry to go to a different server
    default-server inter 2s fall 2 rise 2   # health-check every 2 s; DOWN after 2 failures, UP after 2 passes

# Docker's embedded DNS server. HAProxy re-asks it regularly, so replicas that appear
# or disappear are picked up without editing this file (step 7).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s             # a replica gone from DNS for 5 s goes to MAINT
    accepted_payload_size 8192

frontend web
    bind :8080
    default_backend api

backend api
    balance "${BALANCE}"
    option httpchk GET /health
    http-check expect status 200
    # Five slots filled from the DNS name "api". Empty slots show as MAINT on the stats page.
    server-template api 10 api:8000 check resolvers docker init-addr none resolve-prefer ipv4

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends

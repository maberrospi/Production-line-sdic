# The public edge: rate-limits link creation, hides /internal/, logs every request as JSON.
worker_processes auto;                 # one worker per CPU (the default is 1)
events { worker_connections 4096; }   # the default, 512, runs out under load: each request uses 2 (client + upstream)

http {
    log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                                '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
                                '"upstream_s":"$upstream_response_time","total_s":$request_time}';
    access_log /dev/stdout json;

    # Creating links is the abuse target (spam, phishing): 10 per minute per client IP, bursts of 5.
    limit_req_zone $binary_remote_addr zone=create:10m rate=10r/m;
    limit_req_status 429;

    upstream app {
        server app:8000;            # Docker DNS returns both replicas; nginx balances round-robin
        keepalive 32;
    }

    server {
        listen 80;

        location = /api/links {
            limit_req zone=create burst=5 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /internal/ {
            return 404;             # load-test and stats endpoints are for the private network only
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 5s;
        }
    }
}

# Level 1: a production-shaped single server.
# Only nginx publishes ports. The API and database talk over private Docker networks.
# The backend network is internal: Postgres has no route to the internet at all.

services:
  nginx:
    image: nginx:1.27-alpine
    # Left side = port on your machine. Change HTTP_PORT / HTTPS_PORT in .env if 80/443 are taken.
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on: [api]
    restart: unless-stopped
    networks: [frontend]

  api:
    image: ${API_IMAGE:-app-api}:${API_TAG:-v1}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks: [frontend, backend]
    # no ports: nginx reaches it as api:8000

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]
    # no ports: only the API can reach it

  # One-off tool, not started by "docker compose up". Used for Let's Encrypt certificates.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["tools"]
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot

volumes:
  dbdata: {}

networks:
  frontend: {}
  backend:
    internal: true

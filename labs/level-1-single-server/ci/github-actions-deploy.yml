# Example GitHub Actions workflow: test -> build -> push -> deploy over SSH.
# Copy to .github/workflows/deploy.yml in your repo and adapt paths.
#
# Repository secrets needed:
#   DEPLOY_HOST      your VM's IP or hostname
#   DEPLOY_USER      a dedicated deploy user on the VM (member of the docker group)
#   DEPLOY_SSH_KEY   private key for that user (generate a separate key just for CI)
#
# On the VM, set API_IMAGE=ghcr.io/<owner>/app-api in /srv/app/.env and run
#   echo <a GitHub PAT with read:packages> | docker login ghcr.io -u <owner> --password-stdin
# once, so the VM can pull private images.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false   # never run two deploys at once

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements.txt pytest httpx
      - run: cd api && python migrate.py
      - run: cd api && pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected yet; write some!

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/app-api:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -m 600 /dev/null key && echo "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /srv/app && git pull --ff-only && bash scripts/deploy.sh $TAG"

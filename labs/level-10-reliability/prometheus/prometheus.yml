# Scrape every 5 s (production usually uses 15-60 s) and evaluate rules just as often, so the
# lab's compressed alert windows react within seconds.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: checkout
    metrics_path: /metrics/
    static_configs:
      # checkout-v2 only runs in step 7 (profile "canary"); until then its target shows as down.
      - targets: ["checkout-v1:8000", "checkout-v2:8000"]
  - job_name: payments
    metrics_path: /metrics/
    static_configs:
      - targets: ["payments:8000"]

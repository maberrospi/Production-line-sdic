# The API: a Deployment keeps 3 pods running; a Service gives them one stable name ("api").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 3
  progressDeadlineSeconds: 60        # report a stuck rollout after 60 s (default 600)
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                    # at most 1 extra pod during a rollout
      maxUnavailable: 0              # never go below 3 ready pods
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true           # refuse to start if the image would run as root
      containers:
        - name: api
          image: lab-api:1
          imagePullPolicy: IfNotPresent    # kind: the image was loaded, never pulled
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }    # reserved for scheduling; the HPA measures against this
            limits: { cpu: 500m, memory: 128Mi }     # CPU above: throttled. Memory above: OOM-killed.
          readinessProbe:                # send me traffic?
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:                 # restart me? Checks only this process, never dependencies.
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }             # every READY pod with this label gets traffic
  ports:
    - { name: http, port: 80, targetPort: http }

# nginx as a small CDN edge: it proxies everything to the API, and caches the responses of two
# path prefixes, obeying the API's Cache-Control headers, like a CDN does.

proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m max_size=100m inactive=10m use_temp_path=off;

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Everything else goes straight to the API, uncached.
    location / {
        proxy_pass http://api;
    }

    # Cache-eligible paths. Whether a response is actually stored, and for how long, is decided by
    # the API's Cache-Control header: "public, max-age=10" is kept for 10 s, "private" or
    # "no-store" is never kept.
    location = /catalog {
        proxy_pass http://api;
        proxy_cache edge;
        proxy_cache_lock on;                         # one request refreshes, the rest wait for it...
        proxy_cache_use_stale updating error timeout; # ...or get the previous copy while it refreshes
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /me/ {
        proxy_pass http://api;
        proxy_cache edge;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
